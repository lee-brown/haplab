[workspace]
resolver = "2"
members = [
    "crates/hap-core",
    "crates/hap-gpu",
    "crates/hap-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Lee Brown"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/lee-brown/haplab"
homepage = "https://github.com/lee-brown/haplab"
keywords = ["hap", "video", "codec", "gpu", "wgpu", "bc7"]
categories = ["multimedia::video", "compression", "command-line-utilities"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
