[package]
name = "hap-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure Rust, zero-dependency codec and container library for all flavours of HAP video"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
byteorder = "1.5"
thiserror = "2.0"
snap = "1.1"
texpresso = { version = "2.0", features = ["rayon"] }
texture2ddecoder = "0.1"
rayon = "1.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tiff", "tga"] }
log = "0.4"
bcdec_rs = "0.2.0"

[dev-dependencies]
tempfile = "3.17"
